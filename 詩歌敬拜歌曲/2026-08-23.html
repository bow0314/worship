<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黃彭淑嫻師母追思紀念會</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('worship-theme');
      if(saved === 'light'){ document.documentElement.setAttribute('data-theme','light'); }
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F4F1;
    --card:#FCFBF8;
    --ink:#2C3138;
    --ink-soft:#666B72;
    --hair:#E4E2DA;
    --gold:#B4924F;
    --gold-soft:#EAE0C6;
    --danger:#C0392B;
    --pill-ink:#6d5322;
    --s1:#B4924F;  /* 愛使我們相聚一起 · 暖金 */
    --s2:#5C7A9E;  /* 你是唯一 · 霧藍 */
    --s3:#BE875A;  /* 最珍貴的角落 · 暖陶 */
    --s4:#4E5A78;  /* 相約在主裡 · 靛藍 */
    /* 浮動面板專用：同色相加深、帶透明度做毛玻璃染色 */
    --s1-panel:rgba(122,92,32,.62);
    --s2-panel:rgba(40,60,78,.62);
    --s3-panel:rgba(112,68,32,.62);
    --s4-panel:rgba(42,46,68,.66);
    --serif:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  }
  html[data-theme="dark"]{
    --paper:#18181A;
    --card:#232326;
    --ink:#EDEBE6;
    --ink-soft:#9C9990;
    --hair:#37373A;
    --gold:#D2B876;
    --gold-soft:#4A4023;
    --danger:#E0685A;
    --pill-ink:#E8D9AE;
    --s1:#C7A768;
    --s2:#7B98BB;
    --s3:#CE9868;
    --s4:#7580A0;
    --s1-panel:rgba(100,74,26,.66);
    --s2-panel:rgba(32,50,66,.66);
    --s3-panel:rgba(96,58,28,.66);
    --s4-panel:rgba(34,38,58,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.75;-webkit-font-smoothing:antialiased;padding:48px 20px 80px}
  .wrap{max-width:1200px;margin:0 auto}

  header{margin-bottom:32px;text-align:center}
  .eyebrow{font-size:11px;letter-spacing:.26em;color:var(--gold);margin-bottom:10px;font-weight:500}
  h1{font-family:var(--serif);font-size:clamp(19px,3.6vw,24px);line-height:1.4;letter-spacing:.02em;font-weight:700;margin-bottom:6px}
  .sub{font-family:var(--serif);font-size:12.5px;color:var(--ink-soft)}

  .sec-title{display:flex;align-items:baseline;gap:10px;margin:36px 0 16px;padding-bottom:10px;border-bottom:1px solid var(--hair)}
  .sec-title .n{font-family:var(--serif);font-size:11px;color:var(--gold);letter-spacing:.05em;font-weight:700}
  .sec-title h2{font-family:var(--serif);font-size:14px;letter-spacing:.02em;font-weight:700}

  .seq{position:relative}

  .song{background:var(--card);border:1px solid var(--hair);border-left:4px solid var(--stage,var(--gold));border-radius:12px;padding:20px 26px 26px;margin-bottom:16px}
  .song-name{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--stage,var(--ink));margin-bottom:0}

  .lyrics{margin-top:18px}
  .lyrics .lyr-lab{font-size:11px;letter-spacing:.16em;color:var(--stage,var(--gold));margin:20px 0 6px;text-transform:uppercase;font-weight:700}
  .lyrics .lyr-lab:first-child{margin-top:0}
  .lyrics p{font-family:var(--serif);font-size:46.5px;font-weight:500;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:keep-all}
  .lc-verse{color:color-mix(in srgb, var(--stage, var(--gold)) 65%, white 35%)}
  .lc-chorus{color:var(--stage, var(--gold))}
  html[data-theme="light"] .lc-verse{color:color-mix(in srgb, var(--stage, var(--gold)) 90%, black 10%)}
  html[data-theme="light"] .lc-chorus{color:color-mix(in srgb, var(--stage, var(--gold)) 78%, black 10%)}

  .handoff{
    background:var(--card);border:1px solid var(--hair);border-radius:12px;
    padding:13px 18px;margin:0 0 12px;
  }
  .handoff-body{flex:1;min-width:0}
  .handoff-badge{
    display:inline-block;font-size:10px;letter-spacing:.1em;
    color:var(--ink-soft);border:1px solid var(--hair);border-radius:20px;
    padding:1px 9px;margin-bottom:6px;font-weight:500;
  }
  .handoff-line{font-family:var(--serif);font-size:14.5px;line-height:1.65;color:var(--ink);font-weight:700;white-space:pre-wrap}
  .handoff-note{font-size:11px;color:var(--ink-soft);margin-top:5px;line-height:1.6}

  /* 每首詩歌下方的 YouTube／樂譜下載連結 */
  .song-links{margin-top:20px;padding-top:14px;border-top:1px dashed var(--hair);display:flex;flex-wrap:wrap;gap:8px}
  .link-tag{
    display:inline-block;text-decoration:none;word-break:keep-all;
    background:color-mix(in srgb, var(--gold) 13%, transparent);
    color:var(--pill-ink);
    border:1px solid color-mix(in srgb, var(--gold) 10%, transparent);
    border-radius:6px;padding:3px 12px;font-size:12.5px;font-weight:500;
    transition:background-color .15s,color .15s;
  }
  .link-tag:hover{
    background:color-mix(in srgb, var(--gold) 26%, transparent);
    border-color:color-mix(in srgb, var(--gold) 38%, transparent);
  }
  .link-tag .sheet-tag{font-size:.78em;opacity:.75}
  .footer-links{margin-top:10px}

  /* 併入同一個框的項目(例如歌曲後接著的程序段落) */
  .coda{margin-top:22px;border-top:1px dashed var(--hair);padding-top:14px;display:flex;flex-direction:column;gap:10px}
  .coda-item{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
  .coda-badge{font-size:10px;letter-spacing:.1em;color:var(--ink-soft);border:1px solid var(--hair);border-radius:20px;padding:1px 9px;flex:none}
  .coda-line{font-family:var(--serif);font-size:14.5px;font-weight:700;color:var(--ink)}
  .coda-note{font-size:11px;color:var(--ink-soft)}
  .coda-song{flex-direction:column;align-items:stretch}
  .coda-lyrics{margin-top:8px}
  .coda-lyrics p{font-size:20px}

  footer{margin-top:44px;text-align:center;color:var(--ink-soft);font-size:11px}

  @media print{body{padding:0}}

  /* 右上角工具列：主題切換 */
  .toolbar{position:fixed;top:20px;right:20px;z-index:50;display:flex;gap:10px}
  .tbtn{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--hair);border-radius:999px;
    padding:9px 16px;cursor:pointer;font-size:13px;color:var(--ink);font-family:var(--sans);
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  html[data-theme="dark"] .tbtn{box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .tbtn .icon{font-size:15px;line-height:1}
  @media print{.toolbar{display:none}}
  @media (max-width:560px){
    .toolbar{top:12px;right:12px;gap:6px}
    .tbtn{padding:8px 12px;font-size:11.5px}
    .tbtn span:not(.icon){display:none}
    .lyrics p{font-size:24px;line-height:1.55}
    .handoff-line{font-size:13.5px}
  }

  /* 浮動歌詞提示面板：跟隨捲動顯示目前這首歌的演唱順序，毛玻璃 + 階段色染色 */
  .order-float{
    position:fixed;right:20px;bottom:20px;z-index:50;
    background:var(--panel,rgba(60,60,64,.6));
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid rgba(255,255,255,.22);
    border-radius:14px;
    padding:12px 20px;box-shadow:0 6px 22px rgba(0,0,0,.18);
    opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .25s,transform .25s,background-color .3s;
    max-width:min(80vw,320px);
    cursor:grab;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  .order-float.dragging{transition:none;cursor:grabbing}
  html[data-theme="dark"] .order-float{box-shadow:0 6px 22px rgba(0,0,0,.5)}
  .order-float.show{opacity:1;transform:translateY(0);pointer-events:auto}
  .of-name{font-size:12px;color:rgba(255,255,255,.82)}
  .of-code{font-family:var(--serif);font-size:18px;color:#fff;letter-spacing:.02em;white-space:pre-line;margin-top:4px;font-weight:700}
  @media (max-width:560px){
    .order-float{right:12px;bottom:12px;padding:10px 16px}
    .of-name{font-size:11px}
    .of-code{font-size:15px}
  }
</style>
</head>

<script>
  var DEFAULT_ITEMS = [
    {id:'i1', type:'handoff', badge:'宣召', line:'「我知道我的救贖主活著，末後他必站在塵土上。我這皮肉滅絕之後，我必在肉體之外得見上帝」', note:'約伯記 19:25–26'},
    {id:'i2', type:'song', stage:'s1', name:'愛使我們相聚一起', order:'C–V',
     youtube:'https://www.youtube.com/watch?v=phOcOCMspAk',
     sheet:'https://drive.google.com/open?id=16O_8_wby07a3iTl8KJTc7GfEzxbcInnq&usp=drive_fs', body:
'## Chorus\n愛使我們相聚一起\n愛使我們相聚一起\n上帝的愛使我們合而為一\n愛使我們相聚一起\n\n## Verse\n讓我們一起高聲唱\n讓主愛從我們開始\n我們手拉手讓世界知道\n愛使我們相聚一起'},
    {id:'i3', type:'handoff', badge:'信息', line:'獨特的你、唯一的你', note:'陳小恩傳道 & 黃國堯牧師'},
    {id:'i4', type:'song', stage:'s2', name:'你是唯一', order:'V–C–C',
     youtube:'https://www.youtube.com/watch?v=PmRR-lcLj0U',
     sheet:'https://drive.google.com/open?id=1YOirYDfS7dpgJcxR2aiAVKAGVAOXxNRP&usp=drive_fs', body:
'## Verse\n世界有你會更美好\n沒有人能像你\n神的眼中　你是寶貝\n在世上　你就是唯一\n\n## Chorus\n喔你是如此如此特別　在上帝的眼中\n沒有人能取代你\n\n喔你是如此如此特別　在上帝的眼中\n沒有人能取代你'},
    {id:'i5', type:'handoff', badge:'分享時間', line:'心目中的師母 / 對師母的第一印象'},
    {id:'i6', type:'song', stage:'s3', name:'最珍貴的角落', order:'V1–V2–C',
     youtube:'https://www.youtube.com/watch?v=1jlQz4s3KP8',
     sheet:'https://drive.google.com/open?id=1m9qu-wC5J1W9nWzFX7sXOBTiJpFT7i9g&usp=drive_fs', body:
'## Verse 1\n謝謝你璨爛笑容\n照亮我的天空\n謝謝你分享心情\n把我放在你心中\n\n## Verse 2\n夜裡有時為寒冷\n你我生根同暖土\n友情是最亮的星\n我的生命從此美麗\n\n## Chorus\n當你被花朵包圍盡情歡欣\n我帶春風使你舞其中\n當你正走在坎坷路\n我會伴你在左右\n\n一起向藍天歡呼\n向白雲招手\n我們要一起笑一起哭\n千萬人中有個人懂我\n你有最珍貴的角落'},
    {id:'i7', type:'handoff', badge:'分享時間', line:'與師母互動裡印象最深的事'},
    {id:'i8', type:'song', stage:'s4', name:'相約在主裡', order:'V1–V2–C',
     youtube:'https://www.youtube.com/watch?v=Sjfw9ZxXGg8',
     sheet:'https://drive.google.com/open?id=1ty1qPTUZVMokgJz5Bs5KzQ2Cz2cbgrzB&usp=drive_fs', body:
'## Verse 1\n我們相約　在主裡\n共同生活　常相憶\n我們相約　在主裡\n將來有一天　要再歡聚\n\n## Verse 2\n回憶過去　日子裡\n縱有歡笑　也有淚滴\n捨不得要　告訴你\n在主的愛裡　我等著你\n\n## Chorus\n在主裡祝福你\n我在主裡思念你\n願主帶領你　進入迦南地\n\n在主裡祝福你\n我在主裡思念你\n願主賜給你\n豐富的奶與蜜\n\n你可不要忘記\n我們相約在主裡\n記得我們相約　在主裡'},
    {id:'i9', type:'handoff', badge:'程序', line:'終有盡頭'},
    {id:'i10', type:'handoff', badge:'代禱與祝福', line:'代禱與祝福', note:'陳小恩傳道 & 黃國堯牧師', mergeUp:true},
    {id:'i11', type:'handoff', badge:'結束禱告', line:'「在至高之處榮耀歸於神，在地上平安歸與祂所喜悅的人」', note:'路加福音 2:14', mergeUp:true}
  ];

  var ITEMS = DEFAULT_ITEMS;

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderSongBody(body){
    var blocks = String(body || '').split(/\n(?=##\s)/).map(function(b){ return b.trim(); }).filter(Boolean);
    if(!blocks.length) return '';
    return blocks.map(function(block){
      var m = block.match(/^##\s*(.+?)\s*\n([\s\S]*)$/);
      var label = m ? m[1] : '';
      var text = (m ? m[2] : block).replace(/^\n+/, '');
      var isChorus = /chorus/i.test(label);
      var first = text.charAt(0);
      var rest = text.slice(1);
      return '<div class="lyr-lab">' + escapeHtml(label) + '</div>\n' +
        '<p><span class="' + (isChorus ? 'lc-chorus' : 'lc-verse') + '">' + escapeHtml(first) + '</span>' + escapeHtml(rest) + '</p>';
    }).join('\n');
  }

  /* 把標了 mergeUp 的項目，併進前一個項目所在的框裡（同一個序號、同一個外框） */
  function groupItems(items){
    var groups = [];
    items.forEach(function(item){
      if(item.mergeUp && groups.length){
        groups[groups.length - 1].extra.push(item);
      } else {
        groups.push({ main: item, extra: [] });
      }
    });
    return groups;
  }

  function renderCodaItem(item){
    if(item.type === 'song'){
      return '<div class="coda-item coda-song">' +
        '<span class="coda-line">' + escapeHtml(item.name) + '</span>' +
        '<div class="coda-lyrics">' + renderSongBody(item.body) + '</div>' +
        '</div>';
    }
    return '<div class="coda-item">' +
      '<span class="coda-badge">' + escapeHtml(item.badge || '') + '</span>' +
      '<span class="coda-line">' + escapeHtml(item.line || '') + '</span>' +
      (item.note ? '<span class="coda-note">' + escapeHtml(item.note) + '</span>' : '') +
      '</div>';
  }

  /* 只有詩歌編號，格式「( n ) 歌名」（半形括弧＋空格），其餘程序項目不編號 */
  function songLabel(num, name){
    return '( ' + num + ' ) ' + escapeHtml(name);
  }

  function renderSongLinks(item){
    var links = [];
    if(item.youtube) links.push('<a class="link-tag" href="' + escapeHtml(item.youtube) + '" target="_blank" rel="noopener">YouTube</a>');
    if(item.sheet) links.push('<a class="link-tag" href="' + escapeHtml(item.sheet) + '" target="_blank" rel="noopener">' + escapeHtml(item.name) + ' <span class="sheet-tag">(樂譜)</span></a>');
    return links.length ? '<div class="song-links">' + links.join('') + '</div>' : '';
  }

  function renderGroup(group, songNum){
    var main = group.main;
    var codaHtml = group.extra.length ? '<div class="coda">' + group.extra.map(renderCodaItem).join('') + '</div>' : '';
    if(main.type === 'song'){
      var label = songLabel(songNum, main.name);
      return '<div class="song seq" style="--stage:var(--' + main.stage + ')" data-song data-name="' +
        label + '" data-order="' + escapeHtml(main.order || '') + '" data-stage="' + main.stage + '">' +
        '<div class="song-name">' + label + '</div>' +
        '<div class="lyrics">' + renderSongBody(main.body) + '</div>' +
        renderSongLinks(main) +
        codaHtml +
        '</div>';
    }
    return '<div class="handoff seq">' +
      '<div class="handoff-body">' +
      '<div class="handoff-badge">' + escapeHtml(main.badge) + '</div>' +
      '<p class="handoff-line">' + escapeHtml(main.line) + '</p>' +
      (main.note ? '<p class="handoff-note">' + escapeHtml(main.note) + '</p>' : '') +
      codaHtml +
      '</div></div>';
  }

  function renderSeq(){
    var groups = groupItems(ITEMS);
    var songNum = 0;
    var html = groups.map(function(g){
      if(g.main.type === 'song') songNum++;
      return renderGroup(g, songNum);
    }).join('\n');
    document.getElementById('seqRoot').innerHTML = html;
    if(window.__refreshOrderFloat) window.__refreshOrderFloat();
  }

  renderSeq();

  /* 浮動歌詞提示：捲動時顯示目前這首歌的名稱與演唱順序代碼(如 V-C-V-C) */
  (function(){
    var floatEl = document.getElementById('orderFloat');
    var nameEl = document.getElementById('ofName');
    var codeEl = document.getElementById('ofCode');
    var current = null;
    var ticking = false;

    function check(){
      ticking = false;
      var songs = Array.prototype.slice.call(document.querySelectorAll('#seqRoot [data-song]'));
      if(!songs.length){ floatEl.classList.remove('show'); return; }

      var viewH = window.innerHeight;
      var refY = viewH * 0.35;
      var match = null;

      for(var i = 0; i < songs.length; i++){
        var r = songs[i].getBoundingClientRect();
        if(r.top <= refY && r.bottom >= refY){ match = songs[i]; break; }
      }

      if(!match){
        var best = null, bestDist = Infinity;
        for(var j = 0; j < songs.length; j++){
          var rr = songs[j].getBoundingClientRect();
          if(rr.bottom < 0 || rr.top > viewH) continue;
          var dist = Math.abs(rr.top - refY);
          if(dist < bestDist){ bestDist = dist; best = songs[j]; }
        }
        match = best;
      }

      if(match){
        if(match !== current){
          current = match;
          nameEl.textContent = match.getAttribute('data-name');
          codeEl.textContent = match.getAttribute('data-order');
          floatEl.style.setProperty('--panel', 'var(--' + match.getAttribute('data-stage') + '-panel)');
        }
        floatEl.classList.add('show');
      } else {
        current = null;
        floatEl.classList.remove('show');
      }
    }

    function onScroll(){
      if(!ticking){
        ticking = true;
        requestAnimationFrame(check);
      }
    }

    window.addEventListener('scroll', onScroll, { passive:true });
    window.addEventListener('resize', function(){ onScroll(); });
    window.__refreshOrderFloat = check;
    check();
  })();

  /* 浮動面板：可用滑鼠或手指拖曳到任意位置 */
  (function(){
    var panel = document.getElementById('orderFloat');
    var dragging = false;
    var offsetX = 0, offsetY = 0;

    function lockToPixelPosition(){
      var rect = panel.getBoundingClientRect();
      panel.style.left = rect.left + 'px';
      panel.style.top = rect.top + 'px';
      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
    }

    function clamp(val, min, max){ return Math.min(Math.max(val, min), max); }

    function startDrag(x, y){
      dragging = true;
      lockToPixelPosition();
      var rect = panel.getBoundingClientRect();
      offsetX = x - rect.left;
      offsetY = y - rect.top;
      panel.classList.add('dragging');
      return true;
    }

    function moveDrag(x, y){
      if(!dragging) return;
      var w = panel.offsetWidth, h = panel.offsetHeight;
      var left = clamp(x - offsetX, 8, window.innerWidth - w - 8);
      var top = clamp(y - offsetY, 8, window.innerHeight - h - 8);
      panel.style.left = left + 'px';
      panel.style.top = top + 'px';
    }

    function endDrag(){
      dragging = false;
      panel.classList.remove('dragging');
    }

    panel.addEventListener('mousedown', function(e){
      startDrag(e.clientX, e.clientY);
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e){
      if(!dragging) return;
      e.preventDefault();
      moveDrag(e.clientX, e.clientY);
    });
    document.addEventListener('mouseup', endDrag);

    panel.addEventListener('touchstart', function(e){
      var t = e.touches[0];
      if(!t) return;
      startDrag(t.clientX, t.clientY);
      e.preventDefault();
    }, { passive:false });
    document.addEventListener('touchmove', function(e){
      if(!dragging) return;
      var t = e.touches[0];
      if(!t) return;
      e.preventDefault();
      moveDrag(t.clientX, t.clientY);
    }, { passive:false });
    document.addEventListener('touchend', endDrag);
    document.addEventListener('touchcancel', endDrag);
  })();

  (function(){
    syncButton(document.documentElement.getAttribute('data-theme'));

    function syncButton(t){
      var icon = document.getElementById('themeIcon');
      var text = document.getElementById('themeText');
      if(t === 'dark'){
        icon.textContent = '☀️';
        text.textContent = '亮色模式';
      } else {
        icon.textContent = '🌙';
        text.textContent = '暗黑模式';
      }
    }

    window.toggleTheme = function(){
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      syncButton(next);
      try{ localStorage.setItem('worship-theme', next); }catch(e){}
    };
  })();
</script>
</body>
</html>
